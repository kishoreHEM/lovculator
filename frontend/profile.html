<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Title (JS can replace with user's name) -->
  <title>User Profile • Lovculator</title>

  <!-- Description -->
  <meta name="description" content="View user profile on Lovculator — love stories, questions, answers, followers, connections, and activity in the relationship community." />
  <meta name="robots" content="noindex,nofollow" />

  <!-- Theme -->
  <meta name="theme-color" content="#ff4b8d" />

  <!-- Canonical -->
  <link rel="canonical" href="https://lovculator.com/profile" />

  <!-- Open Graph -->
  <meta property="og:title" content="User Profile • Lovculator">
  <meta property="og:description" content="Explore love stories, questions, answers, and connections on Lovculator user profiles.">
  <meta property="og:type" content="profile">
  <meta property="og:url" content="https://lovculator.com/profile">
  <meta property="og:image" content="https://lovculator.com/images/og-profile.png">
  <meta property="og:image:alt" content="Lovculator cover image" />
  <meta property="og:locale" content="en_US" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="User Profile • Lovculator">
  <meta name="twitter:description" content="View love stories, questions, answers, and followers on Lovculator.">
  <meta name="twitter:image" content="https://lovculator.com/images/og-profile.png">
  <meta name="twitter:image:alt" content="Lovculator cover image" />

  <!-- Favicons -->
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
  <link rel="icon" href="/images/favicon.ico" sizes="any">

  <!-- CSS -->
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/profile.css">

  <script src="/js/analytics.js"></script>
  <script src="/js/pwa-register.js"></script>
</head>

<body class="app-layout profile-page">
  <div id="global-header"></div>

  <div class="profile-container">
    <!-- Profile Header Card (Injected dynamically) -->
    <div id="profileInfoContainer">
      <div class="profile-skeleton-header">
        <div class="skeleton-pulse profile-skeleton-avatar"></div>
        <div class="profile-skeleton-text-wrap">
          <div class="skeleton-pulse profile-skeleton-line-title"></div>
          <div class="skeleton-pulse profile-skeleton-line-handle"></div>
          <div class="skeleton-pulse profile-skeleton-line-bio"></div>
        </div>
      </div>
    </div>

    <!-- Compact Horizontal Tabs Bar -->
    <nav class="profile-tabs-bar" id="profileTabsNav" aria-label="Profile navigation tabs" style="display: none;">
      <button type="button" class="profile-tab active" data-tab="stories" role="tab" aria-selected="true">
        <span>Love Stories</span>
        <span class="profile-tab-count" id="tabStoriesCount">0</span>
      </button>
      <button type="button" class="profile-tab" data-tab="questions" role="tab" aria-selected="false">
        <span>Questions</span>
        <span class="profile-tab-count" id="tabQuestionsCount">0</span>
      </button>
      <button type="button" class="profile-tab" data-tab="answers" role="tab" aria-selected="false">
        <span>Answers</span>
        <span class="profile-tab-count" id="tabAnswersCount">0</span>
      </button>
      <button type="button" class="profile-tab" data-tab="followers" role="tab" aria-selected="false">
        <span>Followers</span>
        <span class="profile-tab-count" id="tabFollowersCount">0</span>
      </button>
      <button type="button" class="profile-tab" data-tab="following" role="tab" aria-selected="false">
        <span>Following</span>
        <span class="profile-tab-count" id="tabFollowingCount">0</span>
      </button>
      <button type="button" class="profile-tab" data-tab="activity" role="tab" aria-selected="false">
        <span>Activity</span>
      </button>
    </nav>

    <!-- Two-Column Grid: Main Feed + Right Sidebar -->
    <div class="profile-grid" id="profileGrid" style="display: none;">
      <!-- Main Content Feed Column -->
      <main class="profile-feed-column" id="profileFeed">
        <!-- Stories Tab Pane -->
        <div id="stories-tab" class="profile-tab-pane active" role="tabpanel" aria-labelledby="tab-stories">
          <div class="stories-feed" id="userStoriesContainer"></div>
        </div>

        <!-- Questions Tab Pane -->
        <div id="questions-tab" class="profile-tab-pane" role="tabpanel" aria-labelledby="tab-questions">
          <div class="questions-feed" id="userQuestionsContainer"></div>
        </div>

        <!-- Answers Tab Pane -->
        <div id="answers-tab" class="profile-tab-pane" role="tabpanel" aria-labelledby="tab-answers">
          <div class="answers-feed" id="userAnswersContainer"></div>
        </div>

        <!-- Followers Tab Pane -->
        <div id="followers-tab" class="profile-tab-pane" role="tabpanel" aria-labelledby="tab-followers">
          <div class="users-list" id="followersContainer"></div>
        </div>

        <!-- Following Tab Pane -->
        <div id="following-tab" class="profile-tab-pane" role="tabpanel" aria-labelledby="tab-following">
          <div class="users-list" id="followingContainer"></div>
        </div>

        <!-- Activity Tab Pane -->
        <div id="activity-tab" class="profile-tab-pane" role="tabpanel" aria-labelledby="tab-activity">
          <div class="activity-feed" id="userActivityContainer"></div>
        </div>
      </main>

      <!-- Right Sidebar Column -->
      <aside class="profile-sidebar-column" id="profileSidebar">
        <!-- Sidebar cards dynamically rendered by profile.js -->
      </aside>
    </div>
  </div>

  <!-- Edit Profile Modal -->
  <div id="editProfileModal" class="modal" aria-hidden="true" role="dialog" aria-labelledby="editProfileTitle">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 id="editProfileTitle">Edit Profile</h3>
        <button type="button" class="close-btn" id="closeModalBtn" aria-label="Close modal">&times;</button>
      </div>

      <form id="editProfileForm" class="modal-form">
        <div class="form-group">
          <label for="editDisplayName">Display Name</label>
          <input type="text" id="editDisplayName" name="display_name" maxlength="50" required />
        </div>

        <div class="form-group">
          <label for="editBio">Bio</label>
          <textarea id="editBio" name="bio" rows="3" maxlength="300" placeholder="Tell the community about yourself..."></textarea>
        </div>

        <div class="form-group">
          <label for="editLocation">Location</label>
          <input type="text" id="editLocation" name="location" maxlength="50" placeholder="e.g. New York, USA" />
        </div>

        <div class="form-group">
          <label for="editWork">Work / Education</label>
          <input type="text" id="editWork" name="work_education" placeholder="e.g. Designer, Harvard" />
        </div>

        <div class="form-group">
          <label for="editRelationshipStatus">Relationship Status</label>
          <select id="editRelationshipStatus" name="relationship_status">
            <option value="">Select status...</option>
            <option value="Single">Single</option>
            <option value="In a Relationship">In a Relationship</option>
            <option value="Engaged">Engaged</option>
            <option value="Married">Married</option>
            <option value="It's Complicated">It's Complicated</option>
          </select>
        </div>

        <div class="form-group">
          <label for="editGender">Gender</label>
          <select id="editGender" name="gender">
            <option value="">Select gender...</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label for="editDOB">Date of Birth</label>
          <input type="date" id="editDOB" name="date_of_birth" />
        </div>

        <div class="modal-footer">
          <button type="button" class="btn-profile-action btn-profile-secondary" id="cancelEditBtn">Cancel</button>
          <button type="submit" class="btn-profile-action btn-profile-primary" id="saveProfileBtn">Save Changes</button>
        </div>
        <p id="editProfileMessage" class="edit-message" style="margin-top: 10px; font-weight: 500; font-size: 0.9rem;"></p>
      </form>
    </div>
  </div>

  <!-- SCRIPTS -->
  <script src="/js/auth.js" defer></script>
  <script src="/js/global-header.js"></script>
  <script src="/js/messages.js" defer></script>
  <script src="/js/notifications.js"></script>
  <script src="/js/profile.js" defer></script>
  <script src="/js/love-stories.js" defer></script>
  <script src="/js/social-features.js" defer></script>
  <script src="/js/pwa.js" defer></script>
</body>
</html>
